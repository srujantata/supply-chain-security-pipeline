name: SLSA Level 3 Provenance Generation

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  generate-provenance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 -t ghcr.io/your-repo/your-image:${{ github.ref_name }} --push .

    - name: Generate SLSA Level 3 provenance
      uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v1
      with:
        image_digest: ${{ steps.buildx.outputs.digest }}
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Store provenance as attestation
      run: |
        cosign sign --key /path/to/your/private-key.pem ghcr.io/your-repo/your-image:${{ github.ref_name }}@${{ steps.buildx.outputs.digest }}